<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="licenca.js"></script>
<title>Relatórios — Controle de Banca</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --bg: #020617; --surface: #071226; --surface2: #0f172a; --border: rgba(255, 255, 255, 0.05);
  --text: #e2e8f0; --muted: #94a3b8; --green: #00e5a0; --red: #ff4d6d; --blue: #3b82f6;
  --mono: 'DM Mono', monospace; --sans: 'Inter', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }
.container { max-width: 1400px; margin: auto; padding: 35px; }

/* HEADER */
.header { height: 80px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; border-bottom: 1px solid var(--border); background: rgba(2, 6, 23, 0.7); backdrop-filter: blur(10px); }
.logo { display: flex; align-items: center; gap: 14px; }
.logo-icon { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg,#4f46e5,#2563eb); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; }
.nav-links { display: flex; gap: 12px; }
.nav-item { color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600; padding: 10px 16px; border-radius: 12px; transition: all 0.2s; }
.nav-item.active { background: rgba(79, 70, 229, 0.15); color: #818cf8; }

/* KPIS & FILTROS */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 30px; }
.kpi-box { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 24px; }
.filters-bar { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 24px; margin-bottom: 20px; display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; }
input, select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 12px; font-family: var(--mono); }
button { padding: 12px 20px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; }
.btn-blue { background: var(--blue); color: white; }
.btn-red { background: rgba(255, 77, 109, 0.1); color: var(--red); }

/* GRÁFICOS E TABELA */
.charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 30px; }
.chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 24px; height: 340px; }
.table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 24px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { font-family: var(--mono); color: var(--muted); font-size: 11px; padding: 15px; border-bottom: 1px solid var(--border); text-transform: uppercase; }
td { padding: 15px; border-bottom: 1px solid var(--border); font-family: var(--mono); }
</style>
</head>
<body>

<header class="header">
    <div class="logo"><div class="logo-icon">📈</div><div><h2>Controle de Banca</h2><p style="font-size:10px; color:var(--muted)">DASHBOARD PREMIUM</p></div></div>
    <nav class="nav-links">
        <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
        <a href="nova-operacao.html" class="nav-item">＋ Nova Operação</a>
        <a href="relatorios.html" class="nav-item active">📈 Relatórios & Analytics</a>
    </nav>
</header>

<div class="container">
    <div class="kpi-grid">
        <div class="kpi-box"><div class="muted-text" style="font-size:12px">LUCRO LÍQUIDO</div><div style="font-size:30px; font-weight:800" id="kpiLucro">R$ 0,00</div></div>
        <div class="kpi-box"><div class="muted-text" style="font-size:12px">WIN RATE</div><div style="font-size:30px; font-weight:800" id="kpiWinRate">0%</div></div>
        <div class="kpi-box"><div class="muted-text" style="font-size:12px">TOTAL ENTRADAS</div><div style="font-size:30px; font-weight:800" id="kpiTotal">0</div></div>
    </div>

    <div class="filters-bar">
        <div><label style="font-size:12px; color:var(--muted)">Data Início</label><br><input type="date" id="dataInicio"></div>
        <div><label style="font-size:12px; color:var(--muted)">Data Fim</label><br><input type="date" id="dataFim"></div>
        <button class="btn-blue" onclick="filtrarPorData()">Aplicar Filtro</button>
        <button class="btn-blue" style="background:transparent; border:1px solid var(--border)" onclick="limparFiltros()">Limpar</button>
        <button class="btn-red" style="margin-left:auto" onclick="limparTudo()">🗑 Limpar Banco</button>
    </div>

    <div class="charts-grid">
        <div class="chart-card"><canvas id="chartEvolucao"></canvas></div>
        <div class="chart-card"><canvas id="chartResultados"></canvas></div>
    </div>

    <div class="table-card">
        <table>
            <thead><tr><th>DATA</th><th>DESCRIÇÃO</th><th>RESULTADO</th><th>LUCRO</th><th>AÇÃO</th></tr></thead>
            <tbody id="corpoTabela"></tbody>
        </table>
    </div>
</div>

<script>
// ── PROTEÇÃO DE LICENÇA ──────────────────────────────────────────
(async function() {
    const email = localStorage.getItem('cbi_email_sessao');
    if (!email) { window.location.href = 'login.html'; return; }
    if (typeof window.CBI_LICENCA !== 'undefined' && email !== window.CBI_LICENCA.ADMIN_EMAIL) {
        const lic = await window.CBI_LICENCA.verificarLicenca(email);
        if (!lic.ativa) {
            window.CBI_LICENCA.mostrarTelaAcessoBloqueado(email, lic.motivo, lic.tipo);
        }
    }
})();
// ─────────────────────────────────────────────────────────────────

let dadosOriginais = JSON.parse(localStorage.getItem('operacoes') || '[]');

function renderizar(lista) {
    const corpo = document.getElementById('corpoTabela');
    corpo.innerHTML = '';
    lista.sort((a,b) => new Date(b.data) - new Date(a.data));
    
    lista.forEach(op => {
        corpo.innerHTML += `<tr>
            <td>${new Date(op.data).toLocaleDateString()}</td>
            <td>${op.descricao}</td>
            <td>${op.tiro}</td>
            <td style="color:${op.resultadoFinal >= 0 ? 'var(--green)' : 'var(--red)'}">${op.resultadoFinal.toFixed(2)}</td>
            <td><button class="btn-red" style="padding:5px 10px" onclick="deletar('${op.id}')">Excluir</button></td>
        </tr>`;
    });

    // Atualiza KPIs
    let lucro = lista.reduce((s,o) => s + o.resultadoFinal, 0);
    document.getElementById('kpiLucro').textContent = `R$ ${lucro.toFixed(2)}`;
    document.getElementById('kpiTotal').textContent = lista.length;
}

function filtrarPorData() {
    let inicio = new Date(document.getElementById('dataInicio').value).getTime();
    let fim = new Date(document.getElementById('dataFim').value).setHours(23,59,59);
    
    let filtrados = dadosOriginais.filter(op => {
        let d = new Date(op.data).getTime();
        return d >= inicio && d <= fim;
    });
    renderizar(filtrados);
}

function limparFiltros() {
    document.getElementById('dataInicio').value = '';
    document.getElementById('dataFim').value = '';
    renderizar(dadosOriginais);
}

function deletar(id) {
    dadosOriginais = dadosOriginais.filter(o => o.id !== id);
    localStorage.setItem('operacoes', JSON.stringify(dadosOriginais));
    renderizar(dadosOriginais);
}

function limparTudo() {
    if(confirm("Apagar tudo?")) { localStorage.removeItem('operacoes'); location.reload(); }
}

renderizar(dadosOriginais);
</script>
</body>
</html>
