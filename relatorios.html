<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="licenca.js"></script>
<script src="supabase.js"></script>
<title>Relatórios — Controle de Banca</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --bg: #020617; --surface: #071226; --surface2: #0f172a; --border: rgba(255, 255, 255, 0.05);
  --text: #e2e8f0; --muted: #94a3b8; --green: #00e5a0; --red: #ff4d6d; --blue: #3b82f6;
  --mono: 'DM Mono', monospace; --sans: 'Inter', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }
.container { max-width: 1400px; margin: auto; padding: 35px; }
.header { height: 80px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; border-bottom: 1px solid var(--border); background: rgba(2, 6, 23, 0.7); backdrop-filter: blur(10px); }
.logo { display: flex; align-items: center; gap: 14px; }
.logo-icon { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg,#4f46e5,#2563eb); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; }
.nav-links { display: flex; gap: 12px; }
.nav-item { color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600; padding: 10px 16px; border-radius: 12px; transition: all 0.2s; }
.nav-item.active { background: rgba(79, 70, 229, 0.15); color: #818cf8; }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 30px; }
.kpi-box { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 24px; }
.filters-bar { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 24px; margin-bottom: 20px; display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; }
input, select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 12px; font-family: var(--mono); }
button { padding: 12px 20px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; }
.btn-blue { background: var(--blue); color: white; }
.btn-red { background: rgba(255, 77, 109, 0.1); color: var(--red); }
.charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 30px; }
.chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 24px; height: 340px; }
.table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 24px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { font-family: var(--mono); color: var(--muted); font-size: 11px; padding: 15px; border-bottom: 1px solid var(--border); text-transform: uppercase; }
td { padding: 15px; border-bottom: 1px solid var(--border); font-family: var(--mono); }
.loading { color: var(--muted); font-size: 13px; padding: 20px 0; }
</style>
</head>
<body>

<header class="header">
    <div class="logo"><div class="logo-icon">📈</div><div><h2>Controle de Banca</h2><p style="font-size:10px;color:var(--muted)">DASHBOARD PREMIUM</p></div></div>
    <nav class="nav-links">
        <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
        <a href="nova-operacao.html" class="nav-item">＋ Nova Operação</a>
        <a href="relatorios.html" class="nav-item active">📈 Relatórios & Analytics</a>
    </nav>
</header>

<div class="container">
    <div class="kpi-grid">
        <div class="kpi-box"><div style="font-size:12px;color:var(--muted)">LUCRO LÍQUIDO</div><div style="font-size:30px;font-weight:800" id="kpiLucro">—</div></div>
        <div class="kpi-box"><div style="font-size:12px;color:var(--muted)">WIN RATE</div><div style="font-size:30px;font-weight:800" id="kpiWinRate">—</div></div>
        <div class="kpi-box"><div style="font-size:12px;color:var(--muted)">TOTAL ENTRADAS</div><div style="font-size:30px;font-weight:800" id="kpiTotal">—</div></div>
    </div>

    <div class="filters-bar">
        <div><label style="font-size:12px;color:var(--muted)">Data Início</label><br><input type="date" id="dataInicio"></div>
        <div><label style="font-size:12px;color:var(--muted)">Data Fim</label><br><input type="date" id="dataFim"></div>
        <button class="btn-blue" onclick="filtrarPorData()">Aplicar Filtro</button>
        <button class="btn-blue" style="background:transparent;border:1px solid var(--border)" onclick="limparFiltros()">Limpar</button>
        <button class="btn-red" style="margin-left:auto" onclick="limparTudo()">🗑 Limpar Banco</button>
    </div>

    <div class="charts-grid">
        <div class="chart-card"><canvas id="chartEvolucao"></canvas></div>
        <div class="chart-card"><canvas id="chartResultados"></canvas></div>
    </div>

    <div class="table-card">
        <table>
            <thead><tr><th>DATA</th><th>DESCRIÇÃO</th><th>RESULTADO</th><th>LUCRO</th><th>AÇÃO</th></tr></thead>
            <tbody id="corpoTabela"><tr><td colspan="5" class="loading">Carregando...</td></tr></tbody>
        </table>
    </div>
</div>

<script>
let dadosOriginais = [];
let _userId = localStorage.getItem('cbi_user_id');
let chartEv = null, chartRes = null;

// ── PROTEÇÃO + CARREGAMENTO ───────────────────────────────────
(async function() {
    const email = localStorage.getItem('cbi_email_sessao');
    if (!email) { window.location.href = 'login.html'; return; }
    if (typeof window.CBI_LICENCA !== 'undefined' && email !== window.CBI_LICENCA.ADMIN_EMAIL) {
        const lic = await window.CBI_LICENCA.verificarLicenca(email);
        if (!lic.ativa) { window.CBI_LICENCA.mostrarTelaAcessoBloqueado(email, lic.motivo, lic.tipo); return; }
    }
    await carregarDados();
})();

async function carregarDados() {
    if(!_userId) return;
    try {
        dadosOriginais = await window.CBI_DB.getOperacoes(_userId);
        renderizar(dadosOriginais);
    } catch(e) {
        document.getElementById('corpoTabela').innerHTML = '<tr><td colspan="5" style="color:var(--red)">Erro ao carregar dados.</td></tr>';
    }
}

function renderizar(lista) {
    const corpo = document.getElementById('corpoTabela');
    corpo.innerHTML = '';

    // Só operações válidas (não aporte/saque)
    const ops = lista.filter(o => o.tipo !== 'Aporte' && o.tipo !== 'Saque');
    const sorted = [...ops].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

    if(sorted.length === 0) {
        corpo.innerHTML = '<tr><td colspan="5" style="color:var(--muted);padding:20px;">Nenhuma operação registrada.</td></tr>';
    } else {
        sorted.forEach(op => {
            const val = parseFloat(op.valor||0);
            const cor = val >= 0 ? 'var(--green)' : 'var(--red)';
            const sinal = val > 0 ? '+' : '';
            corpo.innerHTML += `<tr>
                <td>${new Date(op.created_at).toLocaleDateString('pt-BR')}</td>
                <td>${op.descricao || op.tipo}</td>
                <td>${op.tipo}</td>
                <td style="color:${cor}">${sinal}R$ ${Math.abs(val).toFixed(2).replace('.',',')}</td>
                <td><button class="btn-red" style="padding:5px 10px;font-size:12px" onclick="deletar(${op.id})">Excluir</button></td>
            </tr>`;
        });
    }

    // KPIs
    const lucro = ops.reduce((s,o) => s + parseFloat(o.valor||0), 0);
    const greens = ops.filter(o => o.tipo && o.tipo.includes('Green')).length;
    const validos = ops.filter(o => o.tipo !== 'Reembolso').length;
    const winRate = validos > 0 ? Math.round((greens/validos)*100) : 0;

    const elLucro = document.getElementById('kpiLucro');
    elLucro.textContent = (lucro>=0?'+':'')+'R$ '+Math.abs(lucro).toFixed(2).replace('.',',');
    elLucro.style.color = lucro >= 0 ? 'var(--green)' : 'var(--red)';
    document.getElementById('kpiWinRate').textContent = winRate+'%';
    document.getElementById('kpiTotal').textContent = ops.length;

    renderGraficos(ops);
}

function renderGraficos(ops) {
    // Evolução acumulada
    let acum = 0;
    const labels = [];
    const valores = [];
    [...ops].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).forEach((op,i) => {
        acum += parseFloat(op.valor||0);
        labels.push('#'+(i+1));
        valores.push(parseFloat(acum.toFixed(2)));
    });

    if(chartEv) chartEv.destroy();
    const ctx1 = document.getElementById('chartEvolucao').getContext('2d');
    chartEv = new Chart(ctx1, {
        type: 'line',
        data: { labels, datasets: [{ label: 'Evolução da Banca', data: valores, borderColor: '#00e5a0', backgroundColor: 'rgba(0,229,160,0.08)', tension: 0.4, fill: true, pointRadius: 3 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#94a3b8' } } }, scales: { x: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.03)' } }, y: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.05)' } } } }
    });

    // Pizza greens/reds
    const g1 = ops.filter(o=>o.tipo==='Green 1º Tiro').length;
    const g2 = ops.filter(o=>o.tipo==='Green 2º Tiro').length;
    const g3 = ops.filter(o=>o.tipo==='Green 3º Tiro').length;
    const rd = ops.filter(o=>o.tipo==='RED').length;
    const rm = ops.filter(o=>o.tipo==='Reembolso').length;

    if(chartRes) chartRes.destroy();
    const ctx2 = document.getElementById('chartResultados').getContext('2d');
    chartRes = new Chart(ctx2, {
        type: 'doughnut',
        data: { labels: ['G1','G2','G3','RED','Reembolso'], datasets: [{ data: [g1,g2,g3,rd,rm], backgroundColor: ['#00e5a0','#22d3ee','#818cf8','#ff4d6d','#94a3b8'], borderWidth: 0 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', padding: 12 } } } }
    });
}

function filtrarPorData() {
    const inicio = new Date(document.getElementById('dataInicio').value).getTime();
    const fim = new Date(document.getElementById('dataFim').value).setHours(23,59,59);
    const filtrados = dadosOriginais.filter(op => {
        const d = new Date(op.created_at).getTime();
        return d >= inicio && d <= fim;
    });
    renderizar(filtrados);
}

function limparFiltros() {
    document.getElementById('dataInicio').value = '';
    document.getElementById('dataFim').value = '';
    renderizar(dadosOriginais);
}

async function deletar(id) {
    if(!confirm('Excluir esta operação?')) return;
    try {
        await window.CBI_DB.supaFetch('operacoes?id=eq.'+id+'&user_id=eq.'+_userId, 'DELETE');
        await carregarDados();
    } catch(e) { alert('Erro ao excluir: '+e.message); }
}

async function limparTudo() {
    if(confirm('Apagar TODAS as operações? Essa ação não pode ser desfeita.')) {
        try {
            await window.CBI_DB.deletarOperacoes(_userId);
            await carregarDados();
        } catch(e) { alert('Erro: '+e.message); }
    }
}
</script>
</body>
</html>
